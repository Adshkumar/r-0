[color-theme]
name = "Catppuccin Mocha"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#11111B"
blue = "#89B4FA"
cyan = "#94E2D5"
green = "#A6E3A1"
grey = "#313244"
magenta = "#CBA6F7"
orange = "#FAB387"
purple = "#F5C2E7"
red = "#F38BA8"
white = "#CDD6F4"
yellow = "#F9E2AF"

primary-background = "#1E1E2E"
secondary-background = "#181825"
current-background = "#313244"
text = "$white"
dim-text = "#A6ADC8"

