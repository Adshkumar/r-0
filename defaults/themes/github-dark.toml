[color-theme]
name = "GitHub Dark"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#0D1117"
blue = "#58A6FF"
cyan = "#39C5CF"
green = "#3FB950"
grey = "#30363D"
magenta = "#BC8CFF"
orange = "#FFA657"
purple = "#BC8CFF"
red = "#FF7B72"
white = "#C9D1D9"
yellow = "#D29922"

primary-background = "#0D1117"
secondary-background = "#161B22"
current-background = "#21262D"
text = "$white"
dim-text = "#8B949E"

