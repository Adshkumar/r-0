[color-theme]
name = "One Dark"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#1E2227"
blue = "#61AFEF"
cyan = "#56B6C2"
green = "#98C379"
grey = "#3E4451"
magenta = "#C678DD"
orange = "#D19A66"
purple = "#C678DD"
red = "#E06C75"
white = "#ABB2BF"
yellow = "#E5C07B"

primary-background = "#282C34"
secondary-background = "#21252B"
current-background = "#3E4451"
text = "$white"
dim-text = "#5C6370"

