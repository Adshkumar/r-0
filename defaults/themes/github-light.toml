[color-theme]
name = "GitHub Light"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#24292F"
blue = "#0969DA"
cyan = "#1B7C83"
green = "#116329"
grey = "#D0D7DE"
magenta = "#8250DF"
orange = "#953800"
purple = "#8250DF"
red = "#CF222E"
white = "#FFFFFF"
yellow = "#4D2D00"

primary-background = "#FFFFFF"
secondary-background = "#F6F8FA"
current-background = "#EAEFF5"
text = "$black"
dim-text = "#57606A"

[color-theme.syntax]
"comment" = "#6E7781"
"constant" = "#0550AE"
"type" = "#953800"
"type.builtin" = "#953800"
