[color-theme]
name = "Nord"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#242933"
blue = "#81A1C1"
cyan = "#88C0D0"
green = "#A3BE8C"
grey = "#3B4252"
magenta = "#B48EAD"
orange = "#D08770"
purple = "#B48EAD"
red = "#BF616A"
white = "#D8DEE9"
yellow = "#EBCB8B"

primary-background = "#2E3440"
secondary-background = "#242933"
current-background = "#434C5E"
text = "$white"
dim-text = "#7B88A1"

