[color-theme]
name = "Dracula"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#21222C"
blue = "#8BE9FD"
