grey = "#44475A"
magenta = "#FF79C6"
orange = "#FFB86C"
purple = "#BD93F9"
red = "#FF5555"
white = "#F8F8F2"
yellow = "#F1FA8C"

primary-background = "#282A36"
secondary-background = "#21222C"
current-background = "#44475A"
text = "$white"
dim-text = "#6272A4"

