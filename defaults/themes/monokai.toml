cyan = "#66D9EF"
green = "#A6E22E"
grey = "#3E3D32"
magenta = "#F92672"
orange = "#FD971F"
purple = "#AE81FF"
red = "#F92672"
white = "#F8F8F2"
yellow = "#E6DB74"

primary-background = "#272822"
secondary-background = "#1E1F1C"
current-background = "#49483E"
text = "$white"
dim-text = "#75715E"

