[color-theme]
name = "Monokai"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#1E1F1C"
