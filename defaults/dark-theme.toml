#:schema ../extra/schemas/color-theme.json

[color-theme]
name = "r0 Dark"

[ui]
font-family = ""
font-size = 13
header-height = 35
status-height = 25
tab-min-width = 100
activity-width = 48
scroll-width = 10
drop-shadow-width = 4

[color-theme.base]
black = "#181818"
blue = "#3794FF"
cyan = "#4EC9B0"
green = "#89D185"
grey = "#2B2B2B"
magenta = "#C586C0"
orange = "#CE9178"
purple = "#C586C0"
red = "#F14C4C"
white = "#CCCCCC"
yellow = "#CCA700"

primary-background = "#181818"
# Background for 'secondary' elements: panels, palette, status bar, completion, hover
secondary-background = "#181818"
current-background = "#37373D"
text = "$white"
dim-text = "#969696"

[color-theme.syntax]
"comment" = "#6A9955"
"constant" = "#4FC1FF"
"type" = "#4EC9B0"
"typeAlias" = "#4EC9B0"
"number" = "#B5CEA8"
"enum" = "#4EC9B0"
"struct" = "#4EC9B0"
"structure" = "#4EC9B0"
"interface" = "#4EC9B0"
"attribute" = "#DCDCAA"
"constructor" = "#4EC9B0"
"function" = "#DCDCAA"
"method" = "#DCDCAA"
"function.method" = "#DCDCAA"
"keyword" = "#C586C0"
"selfKeyword" = "#569CD6"
"modifier" = "#569CD6"
"field" = "#9CDCFE"
"property" = "#9CDCFE"
"enumMember" = "#4FC1FF"
"enum-member" = "#4FC1FF"
"string" = "#CE9178"
"type.builtin" = "#4EC9B0"
"builtinType" = "#4EC9B0"
"escape" = "#D7BA7D"
"string.escape" = "#D7BA7D"
"embedded" = "#569CD6"
"punctuation" = "#D4D4D4"
"punctuation.delimiter" = "#D4D4D4"
"punctuation.special" = "#569CD6"
"operator" = "#D4D4D4"
"parameter" = "#9CDCFE"
"variable.parameter" = "#9CDCFE"
"symbol" = "#4FC1FF"
"label" = "#4EC9B0"
"text" = "#D4D4D4"
